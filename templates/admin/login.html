{% extends "admin/base.html" %}
{% block title %}Sign in{% endblock %}
{% block bare %}
<div class="login">
  <form method="post" action="/admin/login" class="login-card">
    <span class="mark big"><svg class="ico"><use href="#i-shield"/></svg></span>
    <h1>Compliance console</h1>
    <p class="muted">Sign in to review verification submissions.</p>
    {% if error %}<div class="alert err">{{ error }}</div>{% endif %}
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Email<input class="in" type="email" name="email" autocomplete="username" required autofocus></label>
    <label>Password<input class="in" type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn wide">Sign in</button>
  </form>
</div>
{% endblock %}
